services:
  # API Principal - Laravel
  app:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    command: tail -f /dev/null
    image: spotube-laravel-app
    restart: unless-stopped
    tty: true
    ports:
      - "8000:8000"
    volumes:
      - ./backend-laravel:/var/www
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks:
      - spotube-net

  # Trabalhador das Filas (Downloads em Background)
  queue-worker:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: vibecast-queue-worker
    restart: unless-stopped
    command: tail -f /dev/null
    #command: php artisan queue:work --timeout=300 --tries=3
    volumes:
      - ./backend-laravel:/var/www
    depends_on:
      - db
    networks:
      - spotube-net

  # Servidor Vite (Vue.js)
  frontend:
    image: node:20-alpine
    container_name: vibecast-frontend
    working_dir: /app
    volumes:
      - ./frontend-vibecast:/app
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - spotube-net

  # Microsserviço de Extração - Python
  python-extractor:
    build:
      context: ./extractor-python
      dockerfile: Dockerfile
    image: spotube-python-extractor
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./extractor-python:/app
      # Compartilhando a pasta de músicas do Laravel com o Python!
      - ./backend-laravel/storage/app/public/musicas:/app/musicas
    networks:
      - spotube-net

  # Banco de Dados - MySQL (Porta 3308)
  db:
    image: mysql:8.0
    restart: unless-stopped
    tty: true
    ports:
      - "3308:3306"  # <--- Mapeia a porta 3308 do Windows para a 3306 do Container
    environment:
      MYSQL_DATABASE: VibeCast
      MYSQL_ROOT_PASSWORD: root_password_local
    volumes:
      - spotube-db-data:/var/lib/mysql
    networks:
      - spotube-net

networks:
  spotube-net:
    driver: bridge

volumes:
  spotube-db-data:
    driver: local